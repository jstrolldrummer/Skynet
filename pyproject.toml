[project]
name = "bid-watcher"
version = "0.1.0"
description = "Watches Wyatt & Gray email for bid requests, scaffolds an estimating folder in Dropbox, and drafts a proposal."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "msal>=1.30.0",
    "requests>=2.32.0",
    "dropbox>=12.0.2",
    "python-docx>=1.1.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.scripts]
bid-watcher = "bid_watcher.main:main"
bid-watcher-auth-gmail = "bid_watcher.sources.gmail:cli_authorize"
bid-watcher-auth-outlook = "bid_watcher.sources.outlook:cli_authorize"
bid-watcher-auth-dropbox = "bid_watcher.sinks.dropbox_sink:cli_authorize"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bid_watcher*"]
