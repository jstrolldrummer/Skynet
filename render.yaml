services:
  - type: web
    name: skynet
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TASK_TOKEN
        sync: false
      - key: COMPANY_NAME
        value: Gray Custom Homes
      - key: SENDER_NAME
        value: Wyatt
      - key: OWNER_PHONE
        sync: false
      - key: DATABASE_PATH
        value: /var/data/skynet.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
